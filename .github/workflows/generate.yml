name: generate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: metanorma/metanorma:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # The container image carries its own preinstalled toolchain; the
      # repo lock must drive every leg (site generate included) or the
      # container's stale metanorma-taste renders the legacy HTML lane
      # without the WMO furniture.
      - name: Prepare bundle
        run: |
          unset BUNDLE_GEMFILE RUBYOPT
          apt-get update -qq && apt-get install -y --no-install-recommends build-essential
          bundle install

      - name: Metanorma generate site
        run: |
          unset BUNDLE_GEMFILE RUBYOPT
          bundle exec metanorma site generate --agree-to-terms

      - name: Render HTML with metanorma-document
        run: |
          unset BUNDLE_GEMFILE RUBYOPT
          # site generate strips the leading `sources` segment when laying
          # out compiled documents under _site/documents
          for doc in 1.2.1/PS 1.2.1/DCEG; do
            bundle exec metanorma-document to-html "_site/documents/$doc/document.presentation.xml" \
              --flavor iho -o "_site/documents/$doc/document.mnd.html"
          done

      # Package the compiled documents into release zips served by the site.
      # The aggregate/render-index steps are build-time no-ops: aggregate
      # only reads <slug>.meta.json manifests written by the
      # `metanorma-release release` publishing flow, and render-index does
      # not exist in metanorma-release; site generate already emits
      # _site/index.html.
      - name: Package document registry
        run: |
          unset BUNDLE_GEMFILE RUBYOPT
          bundle exec metanorma-release package --output-dir _site/documents

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
