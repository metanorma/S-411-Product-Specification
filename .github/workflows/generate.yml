name: generate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: metanorma/metanorma:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Metanorma generate site
        run: metanorma site generate --agree-to-terms

      - name: Render HTML with metanorma-document
        run: |
          unset BUNDLE_GEMFILE RUBYOPT
          apt-get update -qq && apt-get install -y --no-install-recommends build-essential
          bundle install
          for doc in src/Documents/1.2.1/PS src/Documents/1.2.1/DCEG; do
            bundle exec metanorma-document to-html "_site/documents/$doc/document.presentation.xml" \
              --flavor iho -o "_site/documents/$doc/document.mnd.html"
          done

      - name: Package document registry
        run: bundle exec metanorma-release package --output-dir _site/documents --dest releases

      - name: Aggregate document registry
        run: bundle exec metanorma-release aggregate --source local:releases --output-dir _site/docs --data-dir _data --include-drafts

      - name: Render registry index
        run: bundle exec metanorma-release render-index --data _data/documents.json --out _site/index.html --flavor iho --manifest metanorma.yml

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
