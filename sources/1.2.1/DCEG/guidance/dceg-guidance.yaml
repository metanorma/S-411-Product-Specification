concentrationofStripsandPatches:
  definition: A strip is a long narrow area of floating ice, about 1 kilometre or
    less in width, usually composed of small fragments detached from the main mass
    of ice, and run together under the influence of wind, swell or current. If the
    area of ice becomes more rounded in shape, it is referred to as a patch. ICESPC
    indicates the concentration in tenths within the area of Strips and Patches.
  values:
  - code: '11'
    meaning: Strips and Patches (concentrations 1/10)
  - code: '12'
    meaning: Strips and Patches (concentrations 2/10)
  - code: '13'
    meaning: Strips and Patches (concentrations 3/10)
  - code: '14'
    meaning: Strips and Patches (concentrations 4/10)
  - code: '15'
    meaning: Strips and Patches (concentrations 5/10)
  - code: '16'
    meaning: Strips and Patches (concentrations 6/10)
  - code: '17'
    meaning: Strips and Patches (concentrations 7/10)
  - code: '18'
    meaning: Strips and Patches (concentrations 8/10)
  - code: '19'
    meaning: Strips and Patches (concentrations 9/10)
  - code: '20'
    meaning: Strips and Patches (concentrations 10/10)
  - code: '99'
    meaning: Undetermined/Unknown
contamination:
