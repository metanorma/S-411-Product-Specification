directionofSastrugi:
  definition: ICEDOS indicates the bearing of a sastrugi.  Sastrugi are sharp, irregular
    ridges formed on a snow surface by wind erosion and deposition. On mobile floating
    ice the ridges are parallel to the direction of the wind at the time they were
    formed.
